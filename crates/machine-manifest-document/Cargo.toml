[package]
name = "machine-manifest-document"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The machine manifest as dotfiles_configurator writes it and every tool reads it: where this machine keeps its repositories, its estates, and the run that wrote it."

[features]
schema = ["dep:schemars", "github-owner/schema"]

[dependencies]
github-owner = { path = "../github-owner" }
schemars = { version = "1.0.4", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.12"

[dev-dependencies]
serde_json = "1.0.142"
