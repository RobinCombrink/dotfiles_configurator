[package]
name = "dotfiles"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
common = { path = "../common" }
github_authentication = { path = "../../githubauthentication" }
clap = { version = "4.5.41", features = ["derive", "string"] }
oauth2 = "5.0.0"
octocrab = "0.44.1"
log = "0.4.27"
env_logger = "0.11.8"
tokio = { version = "1.47.0", features = ["full"] }
reqwest = { version = "0.12.22", features = ["stream"] }
dirs = "6.0.0"
chrono = "0.4.41"
git2="0.20.2"
indicatif = { version = "0.18.0", features = ["tokio"] }
anyhow = "1.0.98"
url = { version = "2.5.4", features = ["serde"] }
secrecy = "0.10.3"
schemars = { version = "1.0.4", features = ["url2"] }
serde = "1.0.219"
serde_json = "1.0.141"
strum = { version = "0.27.2", features = ["derive"] }
time = "0.3.41"
futures = "0.3.31"

[target.'cfg(target_family = "windows")'.build-dependencies]
winresource = "0.1.23"