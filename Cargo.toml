[package]
name = "dotfiles_configurator"
version = "0.0.0-dev"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
github_authentication  = { git = "https://github.com/RobinCombrink/GitHubAuthentication" }
clap = { version = "4.5.43", features = ["derive", "string"] }
octocrab = "0.44.1"
log = "0.4.27"
env_logger = "0.11.8"
tokio = { version = "1.47.1", features = ["full"] }
reqwest = { version = "0.12.22", features = ["stream"] }
dirs = "6.0.0"
chrono = "0.4.41"
git2="0.20.2"
indicatif = { version = "0.18.0", features = ["tokio"] }
anyhow = "1.0.98"
url = { version = "2.5.4", features = ["serde"] }
secrecy = "0.10.3"
schemars = { version = "1.0.4", features = ["url2"] }
serde = "1.0.219"
serde_json = "1.0.142"
serde_path_to_error = "0.1.17"
strum = { version = "0.28.0", features = ["derive"] }
futures = "0.3.31"
toml = "0.8.23"

[dev-dependencies]
cucumber = "0.23.0"
tempfile = "3.20.0"

[[test]]
name = "convergence"
harness = false

[build-dependencies]
anyhow = "1.0.98"
schemars = { version = "1.0.4", features = ["url2"] }
serde = "1.0.219"
serde_json = "1.0.142"
serde_path_to_error = "0.1.17"
strum = { version = "0.28.0", features = ["derive"] }
url = { version = "2.5.4", features = ["serde"] }

[target.'cfg(target_family = "windows")'.build-dependencies]
winresource = "0.1.23"
