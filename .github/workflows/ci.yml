name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Build, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  version:
    name: Next version
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: RobinCombrink/actions-release/.github/workflows/release.yml@728b67450bcefe04ccce6bed2df5ae9ea1f173d7 # v1.2.1
    with:
      dry_run: true

  build:
    name: Build release binary
    needs: [version]
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Stamp the release version
        shell: bash
        run: |
          sed -i "0,/^version = /s/^version = .*/version = \"$RELEASE_VERSION\"/" Cargo.toml
          sed -i "/^name = \"dotfiles_configurator\"\$/{n;s/^version = .*/version = \"$RELEASE_VERSION\"/}" Cargo.lock
          stamped=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$stamped" != "$RELEASE_VERSION" ]; then
            echo "Stamp failed: Cargo.toml reports '$stamped', expected '$RELEASE_VERSION'." >&2
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked --target ${{ env.TARGET }}

      - name: Verify the binary reports the release version
        shell: bash
        run: |
          reported=$(./target/$TARGET/release/dotfiles_configurator.exe --version | tr -d '\r' | awk '{print $NF}')
          if [ "$reported" != "$RELEASE_VERSION" ]; then
            echo "Binary reports '$reported', expected '$RELEASE_VERSION'." >&2
            exit 1
          fi

      - name: Package as archive
        shell: pwsh
        run: |
          Compress-Archive -Path "target/$env:TARGET/release/dotfiles_configurator.exe" -DestinationPath "dotfiles_configurator-windows-x86_64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: dotfiles_configurator-windows-x86_64.zip
          if-no-files-found: error

  release:
    needs: [check, build]
    permissions:
      contents: write
    uses: RobinCombrink/actions-release/.github/workflows/release.yml@728b67450bcefe04ccce6bed2df5ae9ea1f173d7 # v1.2.1
    with:
      artifact_name: release-binaries
